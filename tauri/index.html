<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>éPI</title>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#measurements" data-i18n-aria-label="measurementsHomeLink"><span aria-hidden="true">é</span>éPI</a>
        <nav id="navigation" data-i18n-aria-label="mainNavigation">
          <button type="button" data-page="measurements"><span aria-hidden="true">▤</span><span data-i18n="measurements"></span></button>
          <button type="button" data-page="profiles"><span aria-hidden="true">◉</span><span data-i18n="profiles"></span></button>
          <button type="button" data-page="devices"><span aria-hidden="true">⌁</span><span data-i18n="devices"></span></button>
          <div class="account-nav">
            <button type="button" id="account-button" aria-describedby="account-connection-status">
              <svg class="account-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="9" cy="6.5" r="3.5"/>
                <path d="M2 20v-2a7 7 0 0 1 10-6"/>
                <circle class="account-badge" cx="17" cy="16" r="6"/>
                <path class="account-connected" d="m14.5 16 1.7 1.7 3.3-3.4"/>
                <path class="account-disconnected" d="M17 13.5v2.8m-.2 2.2h.4"/>
              </svg>
              <span data-i18n="account"></span>
            </button>
            <span id="account-connection-status" hidden></span>
            <button type="button" id="sync-status" aria-haspopup="dialog" aria-controls="sync-dialog" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0 1 13-2l2 3M4 15l2 3a8 8 0 0 0 13-2"/>
              </svg>
            </button>
          </div>
        </nav>
        <a class="bluetooth" id="status" href="#bluetooth" aria-controls="view"><span class="status-dot" aria-hidden="true"></span><span aria-live="polite" data-i18n="bluetoothInitialising"></span></a>
        <button type="button" id="retry-bluetooth" hidden data-i18n="restartBluetooth"></button>
      </aside>
      <div class="workspace">
        <header class="toolbar">
          <div class="actions data-actions" id="data-actions">
            <button class="button" type="button" id="reload-data" data-i18n-aria-label="refresh" data-i18n-title="refresh" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4v5h-5M4 20v-5h5M5.1 9a7.5 7.5 0 0 1 12.4-2.5L20 9M4 15l2.5 2.5A7.5 7.5 0 0 0 18.9 15"/></svg>
            </button>
            <button class="button" type="button" id="export-data" hidden aria-labelledby="export-label"><span id="export-label" data-i18n="exportZip"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg></button>
            <button class="button" type="button" id="import-data" hidden aria-labelledby="import-label"><span id="import-label" data-i18n="importZip"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-5 5 5-5 5 5M4 16v4h16v-4"/></svg></button>
            <input id="import-files" type="file" accept=".zip,application/zip" data-i18n-aria-label="importAZipArchive" hidden>
          </div>
          <div class="actions editor-actions" id="editor-actions" hidden></div>
          <div class="actions" id="detail-actions" hidden>
            <button class="button" type="button" id="back-to-measurements" hidden data-i18n="goBack"></button>
            <button class="button" type="button" id="delete-measurement-button" hidden data-i18n="delete"></button>
            <button class="button primary" type="button" id="restore-button" hidden data-i18n="restore"></button>
          </div>
          <div class="profile-select">
            <button type="button" id="profile-icon" data-i18n-aria-label="createAProfile" data-i18n-title="createAProfile"><span id="profile-name" hidden></span></button>
            <select id="profile" data-i18n-aria-label="activeProfile" hidden></select>
            <button type="button" id="notifications-icon" data-i18n-aria-label="notifications" data-i18n-title="notifications" hidden>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
            </button>
            <button class="button" type="button" id="theme-toggle" data-i18n-aria-label="changeTheme" disabled>
              <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.3A9 9 0 0 1 10.7 3.1a9 9 0 1 0 10.2 10.2Z"/></svg>
              <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
            </button>
          </div>
          <div id="notices" aria-live="polite" inert></div>
        </header>
        <main>
          <section id="view" data-i18n-aria-label="measurements">
            <div id="pending-actions" data-i18n-aria-label="pendingActions" hidden></div>
            <div id="view-scroll">
              <div id="view-header"></div>
              <div id="view-content">
                <p class="notice" role="status" data-i18n="loadingData"></p>
              </div>
              <div id="editor-view" hidden></div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <dialog id="editor" aria-labelledby="dialog-title"></dialog>
    <dialog id="sync-dialog" aria-labelledby="sync-title" aria-describedby="sync-message sync-countdown">
      <h2 id="sync-title" data-i18n="syncPending"></h2>
      <p id="sync-message"></p>
      <p id="sync-countdown"></p>
      <form method="dialog" class="actions">
        <button class="button" type="submit" data-i18n="close"></button>
        <button class="button primary" id="sync-now" type="button" data-i18n="syncNow" disabled></button>
      </form>
    </dialog>
    <dialog id="account-dialog" aria-labelledby="account-title">
      <div class="account-heading">
        <h2 id="account-title" data-i18n="signInHeading"></h2>
        <a id="account-badge-free" class="account-plan-badge" href="https://domun.eu/epi/pro" data-account-public-page target="_blank" rel="noopener noreferrer" hidden>Free</a>
        <span id="account-badge-pro" class="account-plan-badge" hidden>Pro</span>
        <p id="account-email" hidden></p>
        <a id="account-plan-free" class="account-plan" href="https://domun.eu/epi/pro" data-account-public-page data-i18n="compareAccountPlans" target="_blank" rel="noopener noreferrer" hidden></a>
        <a id="account-plan-pro" class="account-plan" href="https://domun.eu/account" data-account-public-page data-i18n="manageAccount" target="_blank" rel="noopener noreferrer" hidden></a>
      </div>
      <form id="account-form" class="editor-form">
        <div id="account-fields" class="editor-form">
          <label><span data-i18n="emailAddress"></span> <input name="email" type="email" autocomplete="username" maxlength="254" required></label>
          <label><span data-i18n="password"></span> <input name="password" type="password" autocomplete="current-password" required></label>
        </div>
        <label><span id="account-language-label" data-i18n="language"></span>
          <select name="language" aria-labelledby="account-language-label"></select>
        </label>
        <div id="account-google-fields" class="editor-form" hidden>
          <label><span id="account-google-password-label"></span>
            <input name="googlePassword" type="password" maxlength="1024" disabled>
          </label>
          <label id="account-google-confirm-field" hidden><span data-i18n="newPasswordConfirmation"></span>
            <input name="googlePasswordConfirm" type="password" autocomplete="new-password" maxlength="1024" disabled>
          </label>
        </div>
        <p id="account-google-status" role="status" hidden></p>
        <p id="account-error" class="notice" role="alert" hidden></p>
        <a href="https://domun.eu/epi/privacy-policy" data-account-public-page data-i18n="privacyPolicy" target="_blank" rel="noopener noreferrer"></a>
        <a href="https://domun.eu/epi/delete-account" data-account-public-page data-i18n="requestAccountDeletion" target="_blank" rel="noopener noreferrer"></a>
      </form>
      <div class="actions">
        <div class="account-action-group">
          <button type="submit" class="button primary" id="account-submit" form="account-form" data-i18n="signIn"></button>
          <button type="button" class="button" id="account-google" hidden>
            <img src="./src/google-g.svg" width="18" height="18" alt="">
            <span data-i18n="continueWithGoogle"></span>
          </button>
        </div>
        <div class="account-action-group">
          <button type="button" class="button" id="account-switch" data-i18n="createAccount"></button>
          <button type="button" class="button" id="account-close" data-i18n="close"></button>
        </div>
      </div>
    </dialog>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
