<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>éPI — Pesées Bluetooth</title>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#measurements" aria-label="éPI, accès aux mesures"><span aria-hidden="true">é</span>éPI</a>
        <nav id="navigation" aria-label="Navigation principale">
          <button type="button" data-page="measurements"><span aria-hidden="true">▤</span>Mesures</button>
          <button type="button" data-page="profiles"><span aria-hidden="true">◉</span>Profils</button>
          <button type="button" data-page="devices"><span aria-hidden="true">⌁</span>Appareils</button>
          <button type="button" id="account-button"><span aria-hidden="true">◎</span>Compte</button>
        </nav>
        <a class="bluetooth" id="status" href="#bluetooth" aria-controls="view"><span class="status-dot" aria-hidden="true"></span><span aria-live="polite">Initialisation du Bluetooth…</span></a>
        <button type="button" id="retry-bluetooth" hidden>Relancer le Bluetooth</button>
      </aside>
      <div class="workspace">
        <header class="toolbar">
          <div class="actions data-actions" id="data-actions">
            <button class="button" type="button" id="reload-data" aria-label="Actualiser" title="Actualiser" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4v5h-5M4 20v-5h5M5.1 9a7.5 7.5 0 0 1 12.4-2.5L20 9M4 15l2.5 2.5A7.5 7.5 0 0 0 18.9 15"/></svg>
            </button>
            <button class="button" type="button" id="export-data" aria-labelledby="export-label"><span id="export-label">Export ZIP</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg></button>
            <button class="button" type="button" id="import-data" aria-labelledby="import-label"><span id="import-label">Import ZIP</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-5 5 5-5 5 5M4 16v4h16v-4"/></svg></button>
            <input id="import-files" type="file" accept=".zip,application/zip" aria-label="Importer une archive ZIP" hidden>
          </div>
          <div class="actions editor-actions" id="editor-actions" hidden></div>
          <div class="actions" id="detail-actions" hidden>
            <button class="button" type="button" id="back-to-measurements" hidden>Retour</button>
            <button class="button" type="button" id="delete-measurement-button" hidden>Supprimer</button>
            <button class="button primary" type="button" id="restore-button" hidden>Restaurer</button>
          </div>
          <div class="profile-select">
            <button type="button" id="profile-icon" aria-label="Créer un profil" title="Créer un profil"><span id="profile-name" hidden></span></button>
            <select id="profile" aria-label="Profil actif" hidden></select>
            <button type="button" id="notifications-icon" aria-label="Notifications" title="Notifications" hidden>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
            </button>
            <button class="button" type="button" id="theme-toggle" aria-label="Changer de thème" disabled>
              <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.3A9 9 0 0 1 10.7 3.1a9 9 0 1 0 10.2 10.2Z"/></svg>
              <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
            </button>
          </div>
          <div id="notices" aria-live="polite" inert></div>
        </header>
        <main>
          <section id="view" aria-label="Mesures">
            <div id="pending-actions" aria-label="Actions en attente" hidden></div>
            <div id="view-scroll">
              <div id="view-header"></div>
              <div id="view-content">
                <p class="notice" role="status">Chargement des données…</p>
              </div>
              <div id="editor-view" hidden></div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <dialog id="editor" aria-labelledby="dialog-title"></dialog>
    <dialog id="account-dialog" aria-labelledby="account-title">
      <h2 id="account-title">Connexion</h2>
      <form id="account-form" class="editor-form">
        <div id="account-fields" class="editor-form">
          <label>Adresse e-mail <input name="email" type="email" autocomplete="username" maxlength="254" required></label>
          <label>Mot de passe <input name="password" type="password" autocomplete="current-password" required></label>
        </div>
        <p id="account-email" hidden></p>
        <p id="account-error" class="notice" role="alert" hidden></p>
      </form>
      <div class="actions">
        <button type="button" class="button" id="account-switch">Créer un compte</button>
        <button type="button" class="button" id="account-close">Fermer</button>
        <button type="submit" class="button primary" id="account-submit" form="account-form">Se connecter</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
