<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>éPI — Pesées Bluetooth</title>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#measurements" aria-label="éPI, accès aux mesures"><span aria-hidden="true">é</span>éPI</a>
        <nav id="navigation" aria-label="Navigation principale">
          <button type="button" data-page="measurements"><span aria-hidden="true">▤</span>Mesures</button>
          <button type="button" data-page="profiles"><span aria-hidden="true">◉</span>Profils</button>
          <button type="button" data-page="devices"><span aria-hidden="true">⌁</span>Appareils</button>
        </nav>
        <div class="bluetooth" id="status" role="status"><span class="status-dot"></span><span>Initialisation du Bluetooth…</span></div>
        <button type="button" id="retry-bluetooth" hidden>Relancer le Bluetooth</button>
      </aside>
      <div class="workspace">
        <header class="toolbar">
          <div class="actions data-actions" id="data-actions">
            <button class="button" type="button" id="reload-data" hidden>Actualiser</button>
            <button class="button" type="button" id="export-data">Export ZIP</button>
            <button class="button" type="button" id="import-data">Import ZIP</button>
            <input id="import-files" type="file" accept=".zip,application/zip" aria-label="Importer une archive ZIP" hidden>
          </div>
          <button class="button" type="button" id="back-to-measurements" hidden>Retour</button>
          <div class="profile-select">
            <label for="profile" id="profile-icon"></label>
            <select id="profile" aria-label="Profil actif"></select>
          </div>
        </header>
        <main>
          <div id="notices" aria-live="polite"></div>
          <section id="view" aria-label="Mesures">
            <p class="notice" role="status">Chargement des données…</p>
          </section>
        </main>
      </div>
    </div>
    <dialog id="editor" aria-labelledby="dialog-title"></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
