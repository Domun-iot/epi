<article aria-labelledby="pro-title" lang="{{language}}">
  <h1 id="pro-title">{{title}}</h1>
  <p>{{intro}}</p>
  <ul>
    <li><strong>{{sync}}</strong> — {{syncDescription}}</li>
    <li><strong>{{views}}</strong> — {{viewsDescription}}</li>
    <li><strong>{{zip}}</strong> — {{zipDescription}}</li>
  </ul>
  <h2>{{prices}}</h2>
  <p>{{offer}}</p>
  <!--promo--><p>{{promo}}</p><!--endpromo-->
  <h2>{{compare}}</h2>
  <table class="plan-table">
    <thead><tr><th scope="col">{{feature}}</th><th scope="col">FREE</th><th scope="col">PRO</th></tr></thead>
    <tbody>{{rows}}</tbody>
  </table>
  <!--priced--><p><a class="button" href="/account/epi/subscribe?lang={{locale}}">{{subscribe}}</a></p><!--endpriced-->
</article>
